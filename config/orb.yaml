# Opening-Range-Breakout strategy — the one backtest-validated intraday edge.
# DISABLED by default. Flip enabled: true to paper-trade it (dry-run).
# Validated config: OR=15m, vol_mult>=1.5, wide 2x-range stop, hold-to-close.
orb:
  enabled: true
  or_min: 15
  interval: 5
  vol_mult: 1.5
  stop_range_mult: 2.0
  max_positions: 3
  risk_pct: 0.5          # % of capital risked per trade
  squareoff_ist: "15:15"
  universe: []           # empty -> built-in liquid set
